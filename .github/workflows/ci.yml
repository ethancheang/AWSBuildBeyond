name: Validate Hawker Lingo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unit tests import the AI Lambda, which has its own dependencies.
      - run: npm ci --prefix aws/ai-orders
      - run: npm run check
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # Enables Marcus's typed questions; browser tests mock this host.
          VITE_AI_URL: https://ai.example.invalid/
      - run: npm ci --prefix server
      - run: npm run test:relay
      - run: npm run test:multiplayer
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
